# INSTRUCTIONS:
# ensure the data_processed_ARD100 folder is placed in the same root directory 
# as the YOLO training script
# then pass the target YAML file to the --data flag

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
train: data_processed_ARD100/train_1280.txt
train2: data_processed_ARD100/train2_1280.txt
val: data_processed_ARD100/val_1280.txt
val2: data_processed_ARD100/val2_1280.txt
test: data_processed_ARD100/test_1280.txt
test2: data_processed_ARD100/test2_1280.txt

# Classes
nc: 1  # number of classes
names: ['UAV']  # class names

# specifying the image/mask/label directories for the YOLO dataloader
img_dir: images_1280
mask_dir: masks_1280
label_dir: labels_1280